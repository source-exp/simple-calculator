[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-calculator"
dynamic = ["version"]
description = "A simple calculator with command-line and desktop interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/source-exp/simple-calculator"

[project.scripts]
simple-calculator = "simple_calculator.calculator:main"
simple-calculator-ui = "simple_calculator.calculator_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "simple_calculator.version.__version__"}

[tool.setuptools.package-data]
simple_calculator = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pylint>=3.3",
]
