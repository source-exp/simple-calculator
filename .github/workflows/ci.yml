name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run python -m unittest discover -v
      - name: Lint
        run: uv run pylint src/simple_calculator tests
      - name: Type check
        run: uv run mypy
      - name: Build package
        run: uv build
